<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignments - Dharshana</title>
    <link rel="stylesheet" href="Assets/Assets.css/Assignments.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .pdf-viewer {
            margin-top: 3rem;
            display: none;
        }

        .pdf-viewer iframe {
            width: 100%;
            height: 500px;
            border: 2px solid #ffae00;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">Dharshana</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="skills.html">Skills</a>
        <a href="education.html">Education</a>
        <a href="assignment.html" class="active">Assignments</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="assignments" id="assignments">
    <h2><i class="fa-solid fa-book"></i> Assignments</h2>
    <div class="assignment-tabs">
        <div class="tab" onclick="showPDF('pdfs/assignment1.pdf')"><i class="fa-solid fa-file-lines"></i> Assignment 1</div>
        <div class="tab" onclick="showPDF('pdfs/assignment2.pdf')"><i class="fa-solid fa-file-code"></i> Assignment 2</div>
        <div class="tab" onclick="showPDF('pdfs/assignment3.pdf')"><i class="fa-solid fa-diagram-project"></i> Assignment 3</div>
        <div class="tab" onclick="showPDF('pdfs/assignment4.pdf')"><i class="fa-solid fa-chart-bar"></i> Assignment 4</div>
        <div class="tab" onclick="showPDF('pdfs/assignment5.pdf')"><i class="fa-solid fa-database"></i> Assignment 5</div>
        <div class="tab" onclick="showPDF('pdfs/assignment6.pdf')"><i class="fa-solid fa-gears"></i> Assignment 6</div>
    </div>

    <div class="pdf-viewer" id="pdf-viewer">
        <iframe id="pdf-frame" src="" frameborder="0"></iframe>
    </div>
</section>

<script>
    function showPDF(pdfUrl) {
        const viewer = document.getElementById('pdf-viewer');
        const frame = document.getElementById('pdf-frame');
        frame.src = pdfUrl;
        viewer.style.display = 'block';
    }
</script>

</body>
</html>
